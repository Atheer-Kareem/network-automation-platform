lab:
  oob:
    network: 192.168.4.0/24

  ssh:
    username: netdevops
    kex_algorithms:
      - diffie-hellman-group14-sha1
    host_key_algorithms:
      - ssh-rsa

devices:
  - hostname: core01
    host: 192.168.4.10
    port: 22
    driver: cisco_ios
    state_features:
      - routes
      - ospf

  - hostname: br01-rtr01
    host: 192.168.4.11
    port: 22
    driver: cisco_ios
    state_features:
      - routes
      - ospf

  - hostname: br01-sw01
    host: 192.168.4.12
    port: 22
    driver: cisco_ios
    state_features:
      - routes
      - vlans
      - switchports
