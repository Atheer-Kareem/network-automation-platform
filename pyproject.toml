[project]
name = "network-automation-platform"
version = "0.1.0"
description = "A production-style network automation and NetDevOps platform for repeatable, validated network operations."
readme = "README.md"
authors = [
    { name = "Atheer-Kareem", email = "atheer.kareem.tech@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "scrapli[textfsm]>=2026.2.20",
]

[project.scripts]
nap = "network_automation_platform.cli:main"
network-automation-platform = "network_automation_platform.cli:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]
